<style>
  .certs-main{
    max-width: 1100px;
    margin: 0 auto;
    padding: 140px 28px 100px;
  }
  .certs-back{
    margin-bottom: 40px;
  }
  .certs-kicker{
    font-size: 0.85rem;
    color: var(--accent);
    margin: 0 0 14px;
  }
  .certs-title{
    font-size: clamp(2rem, 5vw, 2.8rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin: 0 0 16px;
  }
  .certs-intro{
    color: var(--text-dim);
    max-width: 60ch;
    margin: 0 0 56px;
    font-size: 1.02rem;
  }

  .certs-category{
    margin-bottom: 64px;
  }
  .certs-category:last-child{
    margin-bottom: 0;
  }
  .certs-category-title{
    font-family: var(--font-display);
    font-size: 1.2rem;
    color: var(--text);
    margin: 0 0 24px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }

  .certs-grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }
  .cert-card{
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    width: 100%;
    margin: 0;
    padding: 0;
    text-align: left;
    font-family: var(--font-body);
    font-size: inherit;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    transition: border-color var(--ease) .3s;
  }
  .cert-card:hover{ border-color: var(--accent); }
  .cert-image-well{
    background: radial-gradient(circle at center, #26262d 0%, var(--bg-elevated-2) 72%);
    border-bottom: 1px solid var(--line);
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .cert-image-well img{
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    transition: transform var(--ease) .3s;
  }
  .cert-card:hover .cert-image-well img{ transform: scale(1.04); }
  .cert-info{
    padding: 24px 26px 28px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .cert-title{
    font-family: var(--font-display);
    font-size: 1.1rem;
    color: var(--text);
    margin: 0 0 4px;
    line-height: 1.3;
  }
  .cert-org{
    color: var(--accent);
    font-size: 0.85rem;
    margin: 0 0 12px;
  }
  .cert-desc{
    color: var(--text-dim);
    font-size: 0.9rem;
    line-height: 1.6;
    margin: 0 0 14px;
  }
  .cert-meta{
    color: var(--text-faint);
    font-size: 0.8rem;
    margin: 0;
  }
  .cert-competencies{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .cert-competencies li{
    font-size: 0.76rem;
    color: var(--text-dim);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 5px 12px;
  }
  .cert-expand-hint{
    margin-top: auto;
    padding-top: 14px;
    font-size: 0.78rem;
    color: var(--text-faint);
    transition: color var(--ease) .25s;
  }
  .cert-card:hover .cert-expand-hint{ color: var(--accent); }

  /* Modal */
  .cert-modal{
    position: fixed;
    inset: 0;
    background: rgba(7,7,10,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 2000;
  }
  .cert-modal.open{
    opacity: 1;
    pointer-events: auto;
  }
  .cert-modal-panel{
    position: relative;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 20px;
    max-width: 880px;
    width: 100%;
    max-height: 86vh;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 280px 1fr;
  }
  .cert-modal-image{
    background: radial-gradient(circle at center, #26262d 0%, var(--bg-elevated-2) 72%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
  }
  .cert-modal-image img{
    max-width: 100%;
    max-height: 320px;
    object-fit: contain;
  }
  .cert-modal-body{
    padding: 36px 36px 40px;
    min-width: 0;
  }
  .cert-modal-body h2{
    font-family: var(--font-display);
    font-size: 1.4rem;
    color: var(--text);
    margin: 0 0 6px;
    line-height: 1.25;
  }
  .cert-modal-org{
    color: var(--accent);
    font-size: 0.92rem;
    margin: 0 0 18px;
  }
  .cert-modal-body p{
    color: var(--text-dim);
    font-size: 0.92rem;
    line-height: 1.7;
    margin: 0 0 18px;
  }
  .cert-modal-facts{
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin: 0 0 20px;
    padding: 16px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .cert-modal-fact{ display: flex; flex-direction: column; gap: 3px; }
  .cert-modal-fact-label{ font-size: 0.72rem; color: var(--text-faint); }
  .cert-modal-fact-value{ font-size: 0.85rem; color: var(--text); }
  .cert-modal-body h3{
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    margin: 22px 0 10px;
  }
  .cert-modal-body ul{
    margin: 0 0 18px;
    padding-left: 20px;
    color: var(--text-dim);
    font-size: 0.88rem;
    line-height: 1.65;
  }
  .cert-modal-body ul li{ margin-bottom: 8px; }
  .cert-modal-body ul li strong{ color: var(--text); font-weight: 600; }
  .cert-modal-close{
    position: absolute;
    top: 14px;
    right: 14px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-elevated-2);
    border: 1px solid var(--line-strong);
    border-radius: 50%;
    color: var(--text-dim);
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    transition: color var(--ease) .2s, border-color var(--ease) .2s, transform var(--ease) .3s;
  }
  .cert-modal-close:hover{ color: var(--text); border-color: var(--text-dim); }
  .cert-modal-close:active{ transform: scale(0.9); transition-duration: .12s; }

  @media (max-width: 720px){
    .certs-main{ padding: 110px 20px 70px; }
    .certs-grid{ grid-template-columns: 1fr; }
    .cert-modal{ padding: 16px; }
    .cert-modal-panel{ grid-template-columns: 1fr; max-height: 90vh; }
    .cert-modal-image{ padding: 20px; }
    .cert-modal-image img{ max-height: 220px; }
    .cert-modal-body{ padding: 28px 22px 32px; }
  }
</style>

        <img src="images/insignia-vision-alignment.png" alt="Vision &amp; Alignment Trainer badge">
      </div>
      <div class="cert-info">
        <h3 class="cert-title" data-i18n="cert4_title">Vision &amp; Alignment</h3>

      <p class="cert-modal-org" data-i18n="modal_org_line">Insignia de Capacitador — Missionary Training Centers</p>
      <div class="cert-modal-facts">
        <div class="cert-modal-fact">
          <span class="cert-modal-fact-label" data-i18n="status_label">Estado</span>
          <span class="cert-modal-fact-value" data-i18n="va_status_value">Verificado</span>

      <p data-i18n="va_desc">El destinatario de esta insignia se destaca guiando a las personas hacia sus objetivos al alinear su instrucción con los resultados organizacionales. Estos capacitadores demuestran una comprensión profunda de su propósito docente e integran eficazmente los principios fundamentales en sus sesiones de formación. Inspiran y empoderan a los alumnos conectando toda la instrucción con la misión y visión general de la organización.</p>
      <h3 data-i18n="criteria_heading">Criterios de obtención</h3>
      <ul>
        <li data-i18n="va_crit1"><strong>Alineación de Liderazgo:</strong> capacidad para alinear los programas de formación con la dirección estratégica y los objetivos establecidos por el liderazgo.</li>
        <li data-i18n="va_crit2"><strong>Instrucción Basada en Resultados:</strong> conocimiento integral de los principios y valores fundamentales, y capacidad para transmitir su importancia en un contexto docente.</li>
        <li data-i18n="va_crit3"><strong>Enseñanza Contextual:</strong> habilidad para incorporar aplicaciones prácticas que refuercen los principios clave en las sesiones de formación.</li>
        <li data-i18n="va_crit4"><strong>Instrucción con Propósito:</strong> experiencia en conectar todo el contenido de formación con la misión y el propósito más amplios de la organización.</li>
        <li data-i18n="va_crit5"><strong>Empoderamiento:</strong> capacidad para inspirar y empoderar a los aprendices a alcanzar sus objetivos mediante una instrucción práctica e impactante.</li>
      </ul>
      <h3 data-i18n="narrative_heading">Narrativa</h3>
      <p data-i18n="va_narrative_text">Otorgada por completar los requisitos del grupo In-Field Badging: Vision &amp; Alignment.</p>
      <a href="https://badges.parchment.com/public/assertions/19fpIOtJRiiBRm39PoLUOg?identity__email=tomasvenegas@churchofjesuschrist.org&amp;action=download" target="_blank" rel="noopener noreferrer" class="btn btn-accent">

        <div class="cert-modal-fact">
          <span class="cert-modal-fact-label" data-i18n="achievement_label">Tipo de logro</span>
          <span class="cert-modal-fact-value" data-i18n="achievement_value">Insignia</span>
        </div>
      </div>
      <p data-i18n="prof_desc">El destinatario de esta insignia ha demostrado de forma constante puntualidad, comunicación efectiva y decoro en el lugar de trabajo. Busca oportunidades de crecimiento a través de la retroalimentación, la observación y la reflexión. Establece relaciones positivas con compañeros de trabajo y estudiantes.</p>
      <h3 data-i18n="criteria_heading">Criterios de obtención</h3>
      <ul>
        <li data-i18n="prof_crit1"><strong>Puntualidad y Preparación:</strong> llega puntualmente a los turnos y citas, garantizando estar preparado para cada interacción.</li>
        <li data-i18n="prof_crit2"><strong>Gestión del Tiempo:</strong> comienza y termina las interacciones laborales puntualmente, utilizando el tiempo de forma eficiente.</li>
        <li data-i18n="prof_crit3"><strong>Apariencia Profesional:</strong> cumple con los estándares del lugar de trabajo en cuanto a vestimenta y apariencia.</li>
        <li data-i18n="prof_crit4"><strong>Entorno de Aprendizaje Óptimo:</strong> mantiene entornos libres de distracciones, incluyendo fondos apropiados en Zoom y conexiones de internet estables para las reuniones en línea.</li>
        <li data-i18n="prof_crit5"><strong>Comunicación Profesional:</strong> utiliza un lenguaje digno, evitando jergas o expresiones demasiado informales.</li>
        <li data-i18n="prof_crit6"><strong>Planificación Colaborativa:</strong> trabaja con los supervisores para aprovechar eficazmente el tiempo no dedicado a las tareas principales.</li>
        <li data-i18n="prof_crit7"><strong>Participación Activa:</strong> asiste y participa activamente en todas las reuniones requeridas.</li>
        <li data-i18n="prof_crit8"><strong>Receptividad a la Retroalimentación:</strong> muestra disposición para recibir y aplicar retroalimentación constructiva.</li>
        <li data-i18n="prof_crit9"><strong>Interacciones Positivas:</strong> mantiene interacciones profesionales y positivas con colegas y otras personas.</li>
        <li data-i18n="prof_crit10"><strong>Comunicación Regular:</strong> se comunica regularmente con el equipo, los supervisores y otras partes interesadas según se le indique.</li>
        <li data-i18n="prof_crit11"><strong>Cumplimiento de Políticas:</strong> cumple con todas las políticas laborales y las expectativas específicas del rol.</li>
        <li data-i18n="prof_crit12"><strong>Alineación de Liderazgo:</strong> alinea sus acciones e instrucciones con la dirección aprobada por el liderazgo.</li>
        <li data-i18n="prof_crit13"><strong>Uso de Recursos:</strong> asegura que todo el trabajo se centre en los recursos aprobados.</li>
        <li data-i18n="prof_crit14"><strong>Enfoque en el Equipo:</strong> prioriza el crecimiento y desarrollo de los miembros del equipo por sobre el reconocimiento personal.</li>
        <li data-i18n="prof_crit15"><strong>Confianza y Respeto:</strong> establece relaciones de confianza y respeto con colegas y otras partes interesadas.</li>
      </ul>
