<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 440" role="img" aria-labelledby="iaSvgTitle iaSvgDesc"><title id="iaSvgTitle" data-i18n="svg_ia_title">Filtro de productos</title><desc id="iaSvgDesc" data-i18n="svg_ia_desc">Gemini clasifica cada producto y una regla fija de palabras prohibidas fuerza el rechazo; el resultado es rechazado, cotizar o aprobado.</desc><style>
.th{font:500 14px -apple-system,"Segoe UI",Roboto,sans-serif}
.ts{font:400 12px -apple-system,"Segoe UI",Roboto,sans-serif}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.gray rect{fill:#444441;stroke:#B4B2A9}.gray .th{fill:#F1EFE8}.gray .ts{fill:#D3D1C7}
.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .th{fill:#EEEDFE}.purple .ts{fill:#CECBF6}
.red rect{fill:#791F1F;stroke:#F09595}.red .th{fill:#FCEBEB}.red .ts{fill:#F7C1C1}
.amber rect{fill:#633806;stroke:#EF9F27}.amber .th{fill:#FAEEDA}.amber .ts{fill:#FAC775}
.green rect{fill:#27500A;stroke:#97C459}.green .th{fill:#EAF3DE}.green .ts{fill:#C0DD97}
.lbls{fill:#D3D1C7}
</style>
<defs><marker id="iaArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gray"><rect x="240" y="30" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" data-i18n="svg_ia_scraped" x="340.0" y="52.0" text-anchor="middle" dominant-baseline="central">Producto scrapeado</text></g><line x1="340" y1="74" x2="340" y2="106" class="arr" marker-end="url(#iaArrow)"/><g class="purple"><rect x="210" y="110" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" data-i18n="svg_ia_gemini_t" x="340.0" y="128" text-anchor="middle" dominant-baseline="central">Gemini clasifica</text><text class="ts" data-i18n="svg_ia_gemini_s" x="340.0" y="148" text-anchor="middle" dominant-baseline="central">Peso, tamaño y riesgo</text></g><line x1="340" y1="166" x2="340" y2="198" class="arr" marker-end="url(#iaArrow)"/><g class="gray"><rect x="190" y="202" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" data-i18n="svg_ia_backstop_t" x="340.0" y="220" text-anchor="middle" dominant-baseline="central">Respaldo determinístico</text><text class="ts" data-i18n="svg_ia_backstop_s" x="340.0" y="240" text-anchor="middle" dominant-baseline="central">Palabra prohibida: rechazo forzado</text></g><path d="M340 258 L340 286 L140 286 L140 314" class="arr" marker-end="url(#iaArrow)"/><line x1="340" y1="258" x2="340" y2="314" class="arr" marker-end="url(#iaArrow)"/><path d="M340 286 L540 286 L540 314" class="arr" marker-end="url(#iaArrow)"/><g class="red"><rect x="50" y="318" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" data-i18n="svg_ia_rejected_t" x="140.0" y="336" text-anchor="middle" dominant-baseline="central">Rechazado</text><text class="ts" data-i18n="svg_ia_rejected_s" x="140.0" y="356" text-anchor="middle" dominant-baseline="central">Motores, cajas, usados</text></g><g class="amber"><rect x="250" y="318" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" data-i18n="svg_ia_quote_t" x="340.0" y="336" text-anchor="middle" dominant-baseline="central">Cotizar</text><text class="ts" data-i18n="svg_ia_quote_s" x="340.0" y="356" text-anchor="middle" dominant-baseline="central">Más de 25 kg o 120 cm</text></g><g class="green"><rect x="450" y="318" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" data-i18n="svg_ia_approved_t" x="540.0" y="336" text-anchor="middle" dominant-baseline="central">Aprobado</text><text class="ts" data-i18n="svg_ia_approved_s" x="540.0" y="356" text-anchor="middle" dominant-baseline="central">Flete por Factor K</text></g><g class="purple"><rect x="190" y="400" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="ts lbls" data-i18n="svg_ia_leg1" x="212" y="407" dominant-baseline="central">Criterio de la IA</text><g class="gray"><rect x="370" y="400" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="ts lbls" data-i18n="svg_ia_leg2" x="392" y="407" dominant-baseline="central">Regla fija</text></svg>
