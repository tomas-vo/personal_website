<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 480" role="img" aria-labelledby="clSvgTitle clSvgDesc"><title id="clSvgTitle" data-i18n="svg_cl_title">Cómo se arma el precio</title><desc id="clSvgDesc" data-i18n="svg_cl_desc">Barra apilada: producto, flete interno, flete internacional y provisión aduanera forman el costo landed; encima va el margen.</desc><style>
.th{font:500 14px -apple-system,"Segoe UI",Roboto,sans-serif}
.ts{font:400 12px -apple-system,"Segoe UI",Roboto,sans-serif}
.teal rect{fill:#085041;stroke:#5DCAA5}
.coral rect{fill:#712B13;stroke:#F0997B}
.lbl{fill:#F1EFE8}.lbls{fill:#D3D1C7}
</style>
<text class="th lbl" data-i18n="svg_cl_top" x="320" y="22" text-anchor="middle" dominant-baseline="central">Precio de venta</text><g class="teal"><rect x="240" y="40" width="160" height="60" stroke-width="0.5"/></g><line x1="404" y1="70.0" x2="428" y2="70.0" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/><text class="th lbl" data-i18n="svg_cl_margin_t" x="436" y="61.0" dominant-baseline="central">Tu margen</text><text class="ts lbls" data-i18n="svg_cl_margin_s" x="436" y="79.0" dominant-baseline="central">Sobre el costo landed</text><g class="coral"><rect x="240" y="100" width="160" height="50" stroke-width="0.5"/></g><line x1="404" y1="125.0" x2="428" y2="125.0" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/><text class="th lbl" data-i18n="svg_cl_customs_t" x="436" y="116.0" dominant-baseline="central">Provisión aduanera</text><text class="ts lbls" data-i18n="svg_cl_customs_s" x="436" y="134.0" dominant-baseline="central">IVA + arancel sobre el CIF</text><g class="coral"><rect x="240" y="150" width="160" height="70" stroke-width="0.5"/></g><line x1="404" y1="185.0" x2="428" y2="185.0" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/><text class="th lbl" data-i18n="svg_cl_intl_t" x="436" y="176.0" dominant-baseline="central">Flete internacional</text><text class="ts lbls" data-i18n="svg_cl_intl_s" x="436" y="194.0" dominant-baseline="central">Peso cobrable × Factor K</text><g class="coral"><rect x="240" y="220" width="160" height="30" stroke-width="0.5"/></g><line x1="404" y1="235.0" x2="428" y2="235.0" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/><text class="th lbl" data-i18n="svg_cl_local_t" x="436" y="226.0" dominant-baseline="central">Flete interno</text><text class="ts lbls" data-i18n="svg_cl_local_s" x="436" y="244.0" dominant-baseline="central">Proveedor → casa del socio</text><g class="coral"><rect x="240" y="250" width="160" height="180" stroke-width="0.5"/></g><line x1="404" y1="340.0" x2="428" y2="340.0" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/><text class="th lbl" data-i18n="svg_cl_product_t" x="436" y="331.0" dominant-baseline="central">Producto</text><text class="ts lbls" data-i18n="svg_cl_product_s" x="436" y="349.0" dominant-baseline="central">Precio BRL × tipo de cambio</text><path d="M228 102 L220 102 L220 428 L228 428" fill="none" stroke="#888780" stroke-width="1"/><text class="th lbl" data-i18n="svg_cl_bracket_t" x="208" y="256" text-anchor="end" dominant-baseline="central">Costo landed</text><text class="ts lbls" data-i18n="svg_cl_bracket_s1" x="208" y="274" text-anchor="end" dominant-baseline="central">Todo lo que cuesta</text><text class="ts lbls" data-i18n="svg_cl_bracket_s2" x="208" y="290" text-anchor="end" dominant-baseline="central">traer la pieza</text><text class="ts lbls" data-i18n="svg_cl_footnote" x="320" y="456" text-anchor="middle" dominant-baseline="central">Proporciones ilustrativas</text></svg>
